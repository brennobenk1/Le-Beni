<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3F7A58">
<title>Le&amp;Beni&lt;3</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..700,0..100,0..1;1,9..144,400..700,0..100,0..1&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Verde quente sobre papel marfim, serifa macia (Fraunces SOFT/WONK) e uma rosa-velha só para o coração
   e o que estiver selecionado. As fotos aparecem como polaroides tortinhas presas no mapa. */
:root{
  --bg:#EEF1E7; --surface:#FCFBF5; --surface-2:#E3E8D9; --paper:#FFFEFA;
  --fg:#1A2A1F; --muted:#5D6E5E; --faint:#8A9A89;
  --line:#CBD4C2; --line-soft:#DEE4D5;
  --accent:#3F7A58; --accent-ink:#FFFDF7; --accent-soft:#DCEADC; --accent-dim:#86AE92;
  --petal:#B9607A; --petal-soft:#F3DDE3;
  --route:#3F7A58; --warn:#9A6A2A;
  --shadow:0 1px 2px rgba(26,42,31,.07), 0 8px 22px rgba(26,42,31,.10);
  --shadow-lift:0 2px 4px rgba(26,42,31,.10), 0 14px 34px rgba(26,42,31,.16);
  --tile-filter:none;
  --display:"Fraunces",ui-serif,Georgia,serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --soft:"SOFT" 70, "WONK" 1;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0F1611; --surface:#18211A; --surface-2:#222D23; --paper:#232E24;
  --fg:#E8EEE3; --muted:#9BAB99; --faint:#78887A;
  --line:#2C3A2E; --line-soft:#242F26;
  --accent:#7FCB9B; --accent-ink:#0A1C12; --accent-soft:#213626; --accent-dim:#5C9471;
  --petal:#F08BA4; --petal-soft:#3A222A;
  --route:#7FCB9B; --warn:#D8A961;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 26px rgba(0,0,0,.44);
  --shadow-lift:0 2px 5px rgba(0,0,0,.4), 0 16px 38px rgba(0,0,0,.5);
  --tile-filter:invert(.94) hue-rotate(180deg) brightness(.94) contrast(.88) saturate(.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1611; --surface:#18211A; --surface-2:#222D23; --paper:#232E24;
  --fg:#E8EEE3; --muted:#9BAB99; --faint:#78887A;
  --line:#2C3A2E; --line-soft:#242F26;
  --accent:#7FCB9B; --accent-ink:#0A1C12; --accent-soft:#213626; --accent-dim:#5C9471;
  --petal:#F08BA4; --petal-soft:#3A222A;
  --route:#7FCB9B; --warn:#D8A961;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 26px rgba(0,0,0,.44);
  --shadow-lift:0 2px 5px rgba(0,0,0,.4), 0 16px 38px rgba(0,0,0,.5);
  --tile-filter:invert(.94) hue-rotate(180deg) brightness(.94) contrast(.88) saturate(.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;overflow:hidden;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none !important}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--petal);outline-offset:2px;border-radius:8px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.serif{font-family:var(--display);font-variation-settings:var(--soft)}

/* ---------- barra ---------- */
#app{display:flex;flex-direction:column;height:100%}
.appbar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding-block:11px;
  padding-top:calc(11px + env(safe-area-inset-top,0px));
  background:var(--surface);border-bottom:1px solid var(--line-soft);z-index:900}
.brand{display:flex;align-items:center;gap:7px;min-width:0}
.brand h1{margin:0;font-family:var(--display);font-variation-settings:var(--soft);font-weight:600;
  font-size:1.28rem;letter-spacing:-.005em;white-space:nowrap}
.brand .heart{width:17px;height:17px;flex:0 0 auto;fill:var(--petal);transform-origin:center}
.brand .heart{animation:beat 2.8s ease-in-out 1.2s 2}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.18)}28%{transform:scale(1)}42%{transform:scale(1.12)}}
.stats{margin-left:auto;display:flex;gap:17px;align-items:baseline}
.stat{display:flex;flex-direction:column;line-height:1.1;align-items:flex-start}
.stat b{font-family:var(--display);font-variation-settings:var(--soft);font-weight:600;font-size:1.08rem;
  font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-family:var(--display);font-variation-settings:var(--soft);font-style:italic;
  font-weight:400;font-size:.72rem;color:var(--faint);margin-top:1px}
.barbtns{display:flex;gap:6px;margin-left:2px}
@media (max-width:700px){ .brand h1{font-size:1.08rem} .stats{gap:13px} .stat b{font-size:.98rem} }
@media (max-width:470px){ .stats .stat:nth-child(3){display:none} }

/* ---------- corpo ---------- */
#main{flex:1 1 auto;display:flex;min-height:0;position:relative}
#mapwrap{flex:1 1 auto;position:relative;min-width:0}
#map{position:absolute;inset:0;background:var(--surface-2)}
.leaflet-tile-pane{filter:var(--tile-filter)}
.leaflet-container{font-family:var(--body);background:var(--surface-2)}
.leaflet-control-attribution{font-size:10px;background:var(--surface) !important;color:var(--faint) !important;
  border-radius:8px 0 0 0;padding:2px 7px !important}
.leaflet-control-attribution a{color:var(--muted) !important}
.leaflet-bar a{background:var(--surface) !important;color:var(--fg) !important;border-color:var(--line-soft) !important}
.leaflet-bar{border-radius:10px !important;overflow:hidden;box-shadow:var(--shadow) !important;border:0 !important}

/* ---------- polaroides no mapa ---------- */
.mk{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.mk .pol{background:var(--paper);padding:5px 5px 7px;border-radius:4px;box-shadow:var(--shadow);
  transform:rotate(var(--tilt,-2deg));transition:transform .22s cubic-bezier(.2,.8,.3,1),box-shadow .22s;
  border:1px solid rgba(0,0,0,.05)}
.mk .ph{width:66px;height:66px;border-radius:2px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center}
.mk .ph img{width:100%;height:100%;object-fit:cover;display:block}
.mk .ph svg{width:22px;height:22px;fill:var(--accent-dim)}
.mk .cap{width:66px;margin-top:5px;font-family:var(--display);font-variation-settings:var(--soft);
  font-style:italic;font-size:.66rem;line-height:1.15;color:var(--fg);text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk .tail{width:1px;height:10px;background:var(--accent-dim);opacity:.85}
.mk .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--paper);margin-top:-1px;
  box-shadow:0 1px 3px rgba(0,0,0,.25)}
.mk:hover .pol{transform:rotate(0deg) translateY(-2px);box-shadow:var(--shadow-lift)}
.mk.on .pol{transform:rotate(0deg) scale(1.06);box-shadow:var(--shadow-lift);border-color:var(--petal)}
.mk.on .dot{background:var(--petal)}
.endmk{width:12px;height:12px;border-radius:50%;border:3px solid var(--paper);background:var(--route);box-shadow:var(--shadow)}
.endmk.start{background:var(--paper);border-color:var(--route)}
.heartmk{width:20px;height:20px;fill:var(--petal);filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
@media (prefers-reduced-motion:reduce){ .mk .pol{transition:none} .brand .heart{animation:none} }

/* ---------- controles sobre o mapa ---------- */
#searchbox{position:absolute;z-index:800;top:12px;left:12px;width:min(300px,calc(100% - 24px));display:flex;flex-direction:column;gap:8px}
.field{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-soft);
  border-radius:999px;padding:0 14px;box-shadow:var(--shadow)}
.field svg{width:15px;height:15px;flex:0 0 auto;fill:none;stroke:var(--faint);stroke-width:2}
.field input{flex:1;min-width:0;border:0;background:transparent;padding:10px 0;font-size:.85rem}
.field input:focus{outline:none}
#results{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
#results button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 14px;cursor:pointer;
  border-bottom:1px solid var(--line-soft);font-size:.8rem;line-height:1.35}
#results button:last-child{border-bottom:0}
#results button:hover{background:var(--accent-soft)}

#fabs{position:absolute;z-index:810;left:12px;bottom:max(14px,env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap}
.fab{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:.85rem;
  padding:11px 17px;border-radius:999px;box-shadow:var(--shadow)}
.fab:hover{box-shadow:var(--shadow-lift)}
.fab.alt{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.fab svg{width:15px;height:15px;stroke:currentColor;stroke-width:2.2;fill:none}

#pickbar{position:absolute;z-index:820;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
  padding:10px 16px;background:var(--accent);color:var(--accent-ink);font-size:.84rem;
  font-family:var(--display);font-variation-settings:var(--soft);font-style:italic}
#map.picking{cursor:crosshair}

/* ---------- gravação ---------- */
#rec{position:absolute;z-index:830;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom,0px));
  background:var(--surface);border:1px solid var(--line-soft);border-radius:18px;box-shadow:var(--shadow-lift);
  padding:13px 16px;max-width:460px}
#rec .top{display:flex;align-items:center;gap:9px;margin-bottom:11px}
#rec .live{width:9px;height:9px;border-radius:50%;background:var(--petal);animation:pulse 1.6s infinite}
#rec.paused .live{animation:none;background:var(--warn)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
#rec .who{font-family:var(--display);font-variation-settings:var(--soft);font-weight:600;font-size:.9rem}
#rec .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:13px}
#rec .g b{display:block;font-family:var(--mono);font-size:1.05rem;font-variant-numeric:tabular-nums;line-height:1.2}
#rec .g span{font-family:var(--display);font-variation-settings:var(--soft);font-style:italic;font-size:.7rem;color:var(--faint)}
#rec .btns{display:flex;gap:8px;flex-wrap:wrap}
#recnote{font-size:.74rem;color:var(--muted);margin-top:10px;line-height:1.45}
@media (prefers-reduced-motion:reduce){ #rec .live{animation:none} }

/* ---------- lista / acontecimentos ---------- */
#side{flex:0 0 346px;background:var(--surface);border-left:1px solid var(--line-soft);
  display:flex;flex-direction:column;min-height:0;z-index:850}
.sidehead{display:flex;align-items:center;gap:10px;padding-block:13px;border-bottom:1px solid var(--line-soft);flex:0 0 auto}
.sidehead h2{margin:0;font-family:var(--display);font-variation-settings:var(--soft);font-weight:600;font-size:1.02rem}
.sidehead .count{font-family:var(--display);font-variation-settings:var(--soft);font-style:italic;
  font-size:.76rem;color:var(--faint)}
.icon{border:1px solid var(--line-soft);background:var(--surface);border-radius:999px;width:30px;height:30px;
  display:inline-grid;place-items:center;cursor:pointer;flex:0 0 auto}
.icon:hover{background:var(--accent-soft);border-color:var(--accent-dim)}
.icon svg{width:14px;height:14px;stroke:var(--muted);stroke-width:2.2;fill:none}
.icon.logged{border-color:var(--accent);background:var(--accent-soft)}
.icon.logged svg{stroke:var(--accent)}
#sidetoggle{display:none}
#list{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding-block:12px 26px;display:flex;flex-direction:column;gap:11px}

.folder{border:1px solid var(--line-soft);border-radius:18px;overflow:hidden;background:var(--surface);
  transition:border-color .18s}
.folder.open{border-color:var(--accent-dim)}
.fhead{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;cursor:pointer;
  padding:11px 13px;text-align:left}
.fhead:hover{background:var(--accent-soft)}
.fstack{display:flex;flex:0 0 auto;padding-left:3px}
.fstack .s{width:34px;height:34px;border-radius:3px;overflow:hidden;border:2px solid var(--paper);
  margin-left:-13px;background:var(--surface-2);display:grid;place-items:center;box-shadow:var(--shadow);
  transform:rotate(var(--t,0deg))}
.fstack .s:nth-child(1){--t:-7deg}
.fstack .s:nth-child(2){--t:4deg}
.fstack .s:nth-child(3){--t:-3deg}
.fstack .s:first-child{margin-left:0}
.fstack .s img{width:100%;height:100%;object-fit:cover}
.fstack .s svg{width:13px;height:13px;fill:var(--accent-dim)}
.ftx{min-width:0;flex:1}
.ftx b{display:block;font-family:var(--display);font-variation-settings:var(--soft);font-weight:600;
  font-size:.95rem;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ftx span{display:block;font-size:.73rem;color:var(--muted);margin-top:2px}
.fchev{width:13px;height:13px;stroke:var(--faint);stroke-width:2.4;fill:none;flex:0 0 auto;transition:transform .2s}
.folder.open .fchev{transform:rotate(180deg)}
.fbody{padding:4px 9px 11px;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line-soft)}

.item{display:flex;gap:11px;width:100%;text-align:left;border:0;background:transparent;cursor:pointer;
  padding:8px;border-radius:14px;align-items:flex-start}
.item:hover{background:var(--surface-2)}
.item.on{background:var(--petal-soft)}
.item .th{width:46px;height:46px;flex:0 0 auto;border-radius:4px;overflow:hidden;background:var(--surface-2);
  display:grid;place-items:center;border:2px solid var(--paper);box-shadow:var(--shadow);transform:rotate(-2deg)}
.item .th img{width:100%;height:100%;object-fit:cover}
.item .th svg{width:15px;height:15px;fill:var(--accent-dim)}
.item .tx{min-width:0;flex:1;padding-top:2px}
.item .tx b{display:block;font-family:var(--display);font-variation-settings:var(--soft);font-weight:600;
  font-size:.9rem;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .tx time{display:block;font-family:var(--display);font-variation-settings:var(--soft);font-style:italic;
  font-size:.74rem;color:var(--muted);margin-top:2px}
.item .tx code{display:block;font-family:var(--mono);font-size:.64rem;color:var(--faint);margin-top:3px}
.tag{display:inline-block;font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;
  color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 6px;margin-right:5px;vertical-align:1px}
.empty{padding:22px 10px;color:var(--muted);font-size:.86rem;line-height:1.7}
.empty b{display:block;font-family:var(--display);font-variation-settings:var(--soft);font-style:italic;
  font-size:1.08rem;color:var(--fg);margin-bottom:7px;font-weight:500}

@media (max-width:900px){
  #side{position:absolute;left:0;right:0;bottom:0;top:auto;flex:none;height:48%;
    border-left:0;border-top:1px solid var(--line-soft);border-radius:22px 22px 0 0;
    box-shadow:0 -6px 26px rgba(0,0,0,.14);transition:transform .24s ease}
  #side.collapsed{transform:translateY(calc(100% - 52px))}
  #sidetoggle{display:inline-grid;margin-left:auto}
  #side.collapsed #sidetoggle svg{transform:rotate(180deg)}
  #fabs,#rec{bottom:calc(48% + 14px)}
  #side.collapsed ~ #fabs,#side.collapsed ~ #rec{bottom:66px}
}
@media (prefers-reduced-motion:reduce){ #side{transition:none} .folder,.fchev{transition:none} }

/* ---------- folha ---------- */
#scrim{position:fixed;inset:0;z-index:1000;background:rgba(14,24,17,.5);display:grid;place-items:end center}
.sheet{background:var(--surface);width:min(540px,100%);max-height:92%;display:flex;flex-direction:column;
  border-radius:24px 24px 0 0;box-shadow:var(--shadow-lift);overflow:hidden}
@media (min-width:640px){ #scrim{place-items:center} .sheet{border-radius:22px;max-height:88%} }
.sheethead{display:flex;align-items:flex-start;gap:10px;padding-block:16px;border-bottom:1px solid var(--line-soft);flex:0 0 auto}
.sheethead h3{margin:0;font-family:var(--display);font-variation-settings:var(--soft);font-weight:600;
  font-size:1.16rem;flex:1;min-width:0;line-height:1.3}
.sheethead .sub{display:block;font-family:var(--display);font-variation-settings:var(--soft);font-style:italic;
  font-weight:400;font-size:.8rem;color:var(--muted);margin-top:4px}
.sheetbody{overflow-y:auto;padding-block:18px 20px;flex:1 1 auto}
label.lb{display:block;font-family:var(--display);font-variation-settings:var(--soft);font-style:italic;
  font-size:.82rem;color:var(--muted);margin:0 0 7px;font-weight:400}
.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:13px;padding:11px 13px;font-size:.9rem}
.in:focus{outline:none;border-color:var(--accent)}
textarea.in{resize:vertical;min-height:74px;line-height:1.55}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:15px}
.row>div{flex:1 1 150px;min-width:0}
.coordline{font-family:var(--mono);font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.linkish{border:0;background:none;color:var(--accent);cursor:pointer;font:inherit;text-decoration:underline;padding:0}
.drop{border:1.5px dashed var(--line);border-radius:16px;padding:17px;text-align:center;color:var(--muted);
  font-family:var(--display);font-variation-settings:var(--soft);font-style:italic;font-size:.86rem;cursor:pointer}
.drop:hover{border-color:var(--petal);color:var(--fg);background:var(--petal-soft)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:9px}
.thumbs:empty{display:none}
.thumbs .t{position:relative;aspect-ratio:1;border-radius:4px;overflow:hidden;background:var(--surface-2);max-width:100%;
  border:3px solid var(--paper);box-shadow:var(--shadow)}
.thumbs .t img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.thumbs .t button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:999px;border:0;
  background:rgba(14,24,17,.72);cursor:pointer;display:grid;place-items:center}
.thumbs .t button svg{width:11px;height:11px;stroke:#fff;stroke-width:2.6;fill:none}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;margin:2px 0 16px}
.fact{background:var(--accent-soft);border-radius:14px;padding:10px 12px}
.fact b{display:block;font-family:var(--display);font-variation-settings:var(--soft);font-weight:600;
  font-size:1.04rem;font-variant-numeric:tabular-nums;line-height:1.25}
.fact span{font-family:var(--display);font-variation-settings:var(--soft);font-style:italic;font-size:.73rem;color:var(--muted)}
.actions{display:flex;gap:9px;align-items:center;padding-block:13px;border-top:1px solid var(--line-soft);flex:0 0 auto;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 17px;font-size:.85rem;font-weight:600;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:disabled{opacity:.6;cursor:default}
.btn.danger{color:var(--petal);border-color:var(--petal)}
.btn.danger:hover{background:var(--petal-soft)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.spacer{flex:1}
.note{font-size:.9rem;line-height:1.72;white-space:pre-wrap;overflow-wrap:break-word;margin-top:14px;
  padding-left:13px;border-left:2px solid var(--accent-dim);color:var(--fg)}
.meta{font-size:.78rem;color:var(--muted);margin-top:13px;line-height:1.6}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;
  padding:4px 11px;font-size:.71rem;color:var(--muted);font-family:var(--mono)}
.msg{font-size:.82rem;color:var(--petal);margin-top:11px;line-height:1.5}
.folderrow{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.folderrow input{flex:1;min-width:0}
#lightbox{position:fixed;inset:0;z-index:1100;background:rgba(11,18,13,.94);display:grid;place-items:center;padding:20px}

<script>
(function(){
"use strict";

/* ===================== configuração =====================
   Três valores, todos vindos do console do Google. Nenhum é segredo:
   podem ficar à vista aqui. O LEIAME explica de onde cada um sai.      */
var CONFIG = {
  CLIENT_ID: "907215866915-ve0dp77fk7ecf2t4urrj89sd6mmt7ctc.apps.googleusercontent.com",
  API_KEY:   "AIzaSyBiwZFcJGYYDLY7Hn3-Gl47SdTrFHHo7yk",
  FOLDER_ID: "14j3Hz_cJERaJVHq_rEPrGKb7UcECacIP"
};

/* ===================== utilidades ===================== */
function $(id){ return document.getElementById(id); }
function esc(s){ var d=document.createElement("div"); d.textContent = s==null?"":String(s); return d.innerHTML; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
var MONTHS=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function fmtDate(iso){
  if(!iso) return "sem data";
  var p=String(iso).split("-");
  if(p.length!==3) return iso;
  var d=parseInt(p[2],10), m=parseInt(p[1],10);
  if(!MONTHS[m-1]||!d) return iso;
  return d+" de "+MONTHS[m-1]+" de "+p[0];
}
function todayISO(d){ d=d||new Date(); var p=function(n){return (n<10?"0":"")+n;};
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function fmtClock(ts){ if(!ts) return "—"; var d=new Date(Number(ts)), p=function(n){return (n<10?"0":"")+n;};
  return p(d.getHours())+":"+p(d.getMinutes()); }
function fmtDur(ms){
  var s=Math.round((ms||0)/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60), ss=s%60;
  var p=function(n){return (n<10?"0":"")+n;};
  return h>0 ? h+":"+p(m)+":"+p(ss) : p(m)+":"+p(ss);
}
function num(n, d){ return (Number(n)||0).toFixed(d).replace(".", ","); }
function haversine(a1,o1,a2,o2){
  var R=6371, t=Math.PI/180;
  var dLat=(a2-a1)*t, dLon=(o2-o1)*t;
  var s=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a1*t)*Math.cos(a2*t)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(s)));
}
function heartSVG(){ return '<svg viewBox="0 0 24 24"><path d="M12 21.2S3.8 15.9 3.8 10.1A4.8 4.8 0 0 1 12 7.2a4.8 4.8 0 0 1 8.2 2.9c0 5.8-8.2 11.1-8.2 11.1z"></path></svg>'; }
function routeSVG(){ return '<svg viewBox="0 0 24 24"><path d="M5 19c3 0 3-7 7-7s4-7 7-7" fill="none" stroke="currentColor" stroke-width="2.2"></path></svg>'; }
function tiltOf(id){ var h=0; for(var i=0;i<id.length;i++) h=(h*31+id.charCodeAt(i))|0; return (Math.abs(h)%9)-4; }

/* ===================== Google Drive ===================== */
var DRIVE  = "https://www.googleapis.com/drive/v3";
var UPLOAD = "https://www.googleapis.com/upload/drive/v3/files";
var token = null, tokenClient = null, indexId = null;
var podeGravar = false;

/* Toda chamada: com login usa o token; sem login usa a chave pública,
   que só enxerga arquivos marcados como públicos. */
function g(url, opcoes){
  opcoes = opcoes || {};
  var h = Object.assign({}, opcoes.headers || {});
  var alvo = url;
  if(token){ h.Authorization = "Bearer " + token; }
  else { alvo += (alvo.indexOf("?") < 0 ? "?" : "&") + "key=" + encodeURIComponent(CONFIG.API_KEY); }
  var cfg = { method: opcoes.method || "GET", headers: h };
  if(opcoes.body !== undefined) cfg.body = opcoes.body;
  return fetch(alvo, cfg).then(function(r){
    if(r.status === 401 || r.status === 403){
      var e = new Error("sem permissão"); e.status = r.status; throw e;
    }
    if(!r.ok){
      var e2 = new Error("o Drive respondeu " + r.status); e2.status = r.status; throw e2;
    }
    return r;
  });
}
function gJSON(url, opcoes){ return g(url, opcoes).then(function(r){ return r.json(); }); }

function fotoURL(fileId){
  return DRIVE + "/files/" + fileId + "?alt=media&key=" + encodeURIComponent(CONFIG.API_KEY);
}

/* --- achar (ou criar) o index.json dentro da pasta --- */
function acharIndex(){
  if(indexId) return Promise.resolve(indexId);
  var q = "'" + CONFIG.FOLDER_ID + "' in parents and name = 'index.json' and trashed = false";
  return gJSON(DRIVE + "/files?q=" + encodeURIComponent(q) + "&fields=files(id)&pageSize=1").then(function(j){
    if(j.files && j.files.length){ indexId = j.files[0].id; return indexId; }
    return null;
  });
}
function lerIndex(){
  return acharIndex().then(function(id){
    if(!id) return { folders:[], entries:[] };
    return g(DRIVE + "/files/" + id + "?alt=media").then(function(r){ return r.json(); })
      .catch(function(){ return { folders:[], entries:[] }; });
  });
}
function gravarIndex(dados){
  var corpo = new Blob([JSON.stringify(dados)], { type:"application/json" });
  return acharIndex().then(function(id){
    if(id){
      return g(UPLOAD + "/" + id + "?uploadType=media", {
        method:"PATCH", headers:{ "Content-Type":"application/json" }, body: corpo
      }).then(function(){ return id; });
    }
    return criarArquivo(corpo, "application/json", "index.json").then(function(novo){
      indexId = novo;
      return tornarPublico(novo).then(function(){ return novo; });
    });
  });
}

/* --- criar arquivo (multipart: metadados + conteúdo) --- */
function criarArquivo(blob, mime, nome){
  var limite = "lebeni" + Math.random().toString(36).slice(2);
  var meta = JSON.stringify({ name: nome, parents: [CONFIG.FOLDER_ID] });
  var cabeca = "--" + limite + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" + meta +
               "\r\n--" + limite + "\r\nContent-Type: " + mime + "\r\n\r\n";
  var cauda = "\r\n--" + limite + "--\r\n";
  var corpo = new Blob([cabeca, blob, cauda], { type: "multipart/related; boundary=" + limite });
  return gJSON(UPLOAD + "?uploadType=multipart&fields=id", {
    method:"POST", headers:{ "Content-Type":"multipart/related; boundary=" + limite }, body: corpo
  }).then(function(j){ return j.id; });
}
function tornarPublico(fileId){
  return g(DRIVE + "/files/" + fileId + "/permissions", {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ role:"reader", type:"anyone" })
  }).then(function(){ return fileId; }).catch(function(){ return fileId; });
}
function apagarArquivo(fileId){
  if(!fileId) return Promise.resolve();
  return g(DRIVE + "/files/" + fileId, { method:"DELETE" }).catch(function(){});
}

/* ===================== estado ===================== */
var folders = [], entries = [], selected = null;
function folderOf(id){ for(var i=0;i<folders.length;i++) if(folders[i].id===id) return folders[i]; return null; }
function entryById(id){ for(var i=0;i<entries.length;i++) if(entries[i].id===id) return entries[i]; return null; }

/* Toda gravação relê o index antes de escrever, junta a mudança e grava.
   Assim, se vocês dois salvarem quase ao mesmo tempo, nada se perde. */
function mudarIndex(mudanca){
  return lerIndex().then(function(atual){
    atual.folders = atual.folders || [];
    atual.entries = atual.entries || [];
    mudanca(atual);
    return gravarIndex(atual).then(function(){ return atual; });
  }).then(function(atual){
    aplicar(atual);
  });
}
function aplicar(d){
  folders = (d.folders || []).slice();
  folders.push({ id:"inbox", name:"Momentos soltos", createdAt:0 });
  entries = (d.entries || []).map(function(en){
    en.folderId = folderOf(en.folderId) ? en.folderId : "inbox";
    en.photos = en.photos || [];
    en.photoCount = en.photos.length;
    en.cover = en.photos.length ? fotoURL(en.photos[0].thumbId) : "";
    return en;
  });
  if(selected && !entryById(selected)) selected = null;
  renderStats(); renderList(); renderMap();
}
function reload(){
  if(!CONFIG.API_KEY || !CONFIG.FOLDER_ID){ semConfig(); return Promise.resolve(); }
  return lerIndex().then(aplicar).catch(function(){
    $("list").innerHTML = '<div class="empty"><b>Não deu para ler o Drive.</b>' +
      'Confira se a pasta está compartilhada como “qualquer pessoa com o link” e se os valores do CONFIG estão certos.</div>';
  });
}
function semConfig(){
  $("list").innerHTML = '<div class="empty"><b>Falta ligar o site ao Drive.</b>' +
    'Abra o LEIAME: são três valores pra colar no começo deste arquivo, e todos saem do console do Google.</div>';
  $("fabs").hidden = true;
}

/* ===================== mapa ===================== */
var map, markers = {}, lines = {}, endpoints = {};
var TILES = "https://tile.openstreetmap.org/{z}/{x}/{y}.png";
var tileLayer = null;

function isDark(){
  var t = document.documentElement.getAttribute("data-theme");
  if(t === "dark") return true;
  if(t === "light") return false;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function setTiles(){
  if(!map || tileLayer) return;
  tileLayer = L.tileLayer(TILES, {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);
  tileLayer.setZIndex(1);
}
function accentColor(){ return getComputedStyle(document.documentElement).getPropertyValue("--route").trim() || "#3F7A58"; }

function initMap(){
  map = L.map("map", { zoomControl:true, attributionControl:true }).setView([-25.4284,-49.2733], 12);
  setTiles();
  map.on("click", function(e){
    if(!picking) return;
    var ll = e.latlng;
    stopPicking();
    openPlaceForm(formCtx.existing, { lat:ll.lat, lng:ll.lng }, formCtx.draft);
  });
}
function clearLayers(){
  Object.keys(markers).forEach(function(k){ map.removeLayer(markers[k]); });
  Object.keys(lines).forEach(function(k){ map.removeLayer(lines[k]); });
  Object.keys(endpoints).forEach(function(k){ endpoints[k].forEach(function(m){ map.removeLayer(m); }); });
  markers = {}; lines = {}; endpoints = {};
}
function renderMap(){
  if(!map) return;
  clearLayers();
  entries.forEach(function(en){
    if(en.type === "route"){
      if(!en.points || en.points.length < 2) return;
      var pts = en.points.map(function(p){ return [p[0], p[1]]; });
      var line = L.polyline(pts, { color: accentColor(), weight:4, opacity:.9, lineJoin:"round" }).addTo(map);
      line.on("click", function(ev){ L.DomEvent.stop(ev); select(en.id); openDetail(en.id); });
      lines[en.id] = line;
      var a = L.marker(pts[0], { icon: L.divIcon({ className:"", html:'<div class="endmk start"></div>', iconSize:[13,13], iconAnchor:[6,6] }) }).addTo(map);
      var b = L.marker(pts[pts.length-1], { icon: L.divIcon({ className:"", iconSize:[20,20], iconAnchor:[10,10],
        html:'<svg class="heartmk" viewBox="0 0 24 24"><path d="M12 21.2S3.8 15.9 3.8 10.1A4.8 4.8 0 0 1 12 7.2a4.8 4.8 0 0 1 8.2 2.9c0 5.8-8.2 11.1-8.2 11.1z"></path></svg>' }) }).addTo(map);
      b.on("click", function(){ select(en.id); openDetail(en.id); });
      endpoints[en.id] = [a,b];
    } else {
      var html = '<div class="mk'+(selected===en.id?" on":"")+'" style="--tilt:'+tiltOf(en.id)+'deg">' +
        '<div class="pol"><div class="ph">' + (en.cover ? '<img src="'+en.cover+'" alt="">' : heartSVG()) + '</div>' +
        '<div class="cap">'+esc(en.title)+'</div></div>' +
        '<div class="tail"></div><div class="dot"></div></div>';
      var mk = L.marker([en.lat, en.lng], {
        icon: L.divIcon({ className:"", html:html, iconSize:[92,122], iconAnchor:[46,117] })
      }).addTo(map);
      mk.on("click", function(){ select(en.id); openDetail(en.id); });
      markers[en.id] = mk;
    }
  });
}
function focusEntry(en){
  if(en.type === "route" && en.points && en.points.length){
    map.fitBounds(L.latLngBounds(en.points.map(function(p){ return [p[0],p[1]]; })).pad(0.15));
  } else if(en.type === "place"){
    map.setView([en.lat, en.lng], Math.max(map.getZoom(), 15));
  }
}

/* ===================== busca de endereço ===================== */
var qEl = $("q"), resEl = $("results"), qTimer = 0;
qEl.addEventListener("input", function(){
  clearTimeout(qTimer);
  var v = qEl.value.trim();
  if(v.length < 3){ resEl.hidden = true; resEl.innerHTML = ""; return; }
  qTimer = setTimeout(function(){ doSearch(v); }, 500);
});
function doSearch(v){
  fetch("https://nominatim.openstreetmap.org/search?format=json&limit=6&accept-language=pt-BR&q=" + encodeURIComponent(v))
    .then(function(r){ return r.json(); })
    .then(function(list){
      if(!list || !list.length){ resEl.innerHTML = '<button type="button" disabled>Nada encontrado</button>'; resEl.hidden = false; return; }
      resEl.innerHTML = list.map(function(h){ return '<button type="button">'+esc(h.display_name)+'</button>'; }).join("");
      resEl.hidden = false;
      Array.prototype.forEach.call(resEl.children, function(b, i){
        b.onclick = function(){
          map.setView([parseFloat(list[i].lat), parseFloat(list[i].lon)], 16);
          resEl.hidden = true; qEl.blur();
        };
      });
    })
    .catch(function(){
      resEl.innerHTML = '<button type="button" disabled>Busca indisponível agora</button>';
      resEl.hidden = false;
    });
}
document.addEventListener("pointerdown", function(e){
  if(!e.target.closest("#searchbox")) resEl.hidden = true;
});

/* ===================== estatísticas e lista ===================== */
function renderStats(){
  var places = 0, km = 0, photos = 0;
  entries.forEach(function(e){
    if(e.type === "place") places++; else km += (e.distanceKm || 0);
    photos += (e.photoCount || 0);
  });
  $("s-places").textContent = places;
  $("s-photos").textContent = photos;
  $("s-km").textContent = km < 10 ? num(km,1) : Math.round(km);
  $("s-count").textContent = entries.length ? entries.length + (entries.length===1?" memória":" memórias") : "";
}
var openFolders = {};
function renderList(){
  var el = $("list");
  if(!entries.length && folders.length <= 1){
    el.innerHTML = '<div class="empty"><b>O mapa de vocês está esperando a primeira memória.</b>' +
      (podeGravar
        ? 'Marque um lugar onde vocês estiveram, ou grave o trajeto da próxima saída. Cada coisa fica guardada num acontecimento — “Nossa viagem pra praia”, “Aniversário dela”, o que vocês quiserem.'
        : 'Quando alguém marcar o primeiro lugar, ele aparece aqui pra todo mundo que abrir este endereço.') +
      '</div>';
    return;
  }
  var groups = {};
  folders.forEach(function(f){ groups[f.id] = []; });
  entries.forEach(function(en){
    var fid = groups[en.folderId] ? en.folderId : "inbox";
    (groups[fid] = groups[fid] || []).push(en);
  });
  var order = folders.slice().sort(function(a,b){
    if(a.id === "inbox") return 1;
    if(b.id === "inbox") return -1;
    return (b.createdAt||0) - (a.createdAt||0);
  });
  var html = "";
  order.forEach(function(f){
    var list = (groups[f.id] || []).slice().sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); });
    if(f.id === "inbox" && !list.length) return;
    var open = !!openFolders[f.id];
    var covers = list.filter(function(e){ return e.cover; }).slice(0,3);
    var stack = covers.length
      ? covers.map(function(e){ return '<span class="s"><img src="'+e.cover+'" alt=""></span>'; }).join("")
      : '<span class="s">'+heartSVG()+'</span>';
    var nPlaces = list.filter(function(e){ return e.type==="place"; }).length;
    var nRoutes = list.length - nPlaces;
    var bits = [];
    if(nPlaces) bits.push(nPlaces + (nPlaces===1?" lugar":" lugares"));
    if(nRoutes) bits.push(nRoutes + (nRoutes===1?" trajeto":" trajetos"));
    if(!bits.length) bits.push("esperando a primeira memória");
    html += '<div class="folder'+(open?" open":"")+'" data-f="'+esc(f.id)+'">' +
      '<button class="fhead" type="button" data-toggle="'+esc(f.id)+'">' +
        '<span class="fstack">'+stack+'</span>' +
        '<span class="ftx"><b>'+esc(f.name)+'</b><span>'+bits.join(" · ")+'</span></span>' +
        '<svg class="fchev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"></path></svg>' +
      '</button>';
    if(open){
      html += '<div class="fbody">';
      if(!list.length) html += '<div class="empty" style="padding:12px 6px">Nada guardado aqui ainda.</div>';
      list.forEach(function(en){
        var sub = en.type === "route"
          ? '<span class="tag">trajeto</span>' + num(en.distanceKm,2) + " km · " + fmtDur(en.durationMs)
          : (Number(en.lat)||0).toFixed(4) + ", " + (Number(en.lng)||0).toFixed(4);
        html += '<button class="item'+(selected===en.id?" on":"")+'" type="button" data-id="'+esc(en.id)+'">' +
          '<span class="th">'+(en.cover ? '<img src="'+en.cover+'" alt="">' : (en.type==="route"?routeSVG():heartSVG()))+'</span>' +
          '<span class="tx"><b>'+esc(en.title)+'</b><time>'+esc(fmtDate(en.date))+'</time><code>'+sub+'</code></span></button>';
      });
      html += '</div>';
    }
    html += '</div>';
  });
  el.innerHTML = html;
  Array.prototype.forEach.call(el.querySelectorAll("[data-toggle]"), function(b){

/* ===================== entrar na conta do site ===================== */
function applyAuth(){
  $("fabs").hidden = !podeGravar || !CONFIG.FOLDER_ID;
  var b = $("authbtn");
  if(b) b.classList.toggle("logged", !!podeGravar);
  renderList();
}
function initAuth(){
  if(!CONFIG.CLIENT_ID || !window.google || !google.accounts || !google.accounts.oauth2) return;
  try {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CONFIG.CLIENT_ID,
      scope: "https://www.googleapis.com/auth/drive.file",
      callback: function(resp){
        if(!resp || !resp.access_token){ return; }
        token = resp.access_token;
        podeGravar = true;
        try { sessionStorage.setItem("lb-logado", "1"); } catch(e){}
        applyAuth();
        reload().then(function(){
          if(!scrim.hidden && scrim.querySelector("#conta-area")) openConta();
        });
      }
    });
    var antes = null;
    try { antes = sessionStorage.getItem("lb-logado"); } catch(e){}
    if(antes) tokenClient.requestAccessToken({ prompt: "" });
  } catch(e){}
}
function entrar(){
  if(!tokenClient){ alertSheet("Login não configurado", "Falta preencher o CLIENT_ID no começo do arquivo."); return; }
  tokenClient.requestAccessToken({ prompt: "select_account consent" });
}
function sair(){
  if(token && google.accounts.oauth2.revoke) { try { google.accounts.oauth2.revoke(token); } catch(e){} }
  token = null; podeGravar = false;
  try { sessionStorage.removeItem("lb-logado"); } catch(e){}
  applyAuth();
  reload();
  openConta();
}
function renovar(){
  return new Promise(function(res, rej){
    if(!tokenClient) return rej(new Error("sem login"));
    var antigo = tokenClient.callback;
    tokenClient.callback = function(resp){
      tokenClient.callback = antigo;
      if(resp && resp.access_token){ token = resp.access_token; podeGravar = true; res(); }
      else rej(new Error("sem login"));
    };
    tokenClient.requestAccessToken({ prompt: "" });
  });
}

/* ===================== imagens ===================== */
function loadBitmap(file){
  if(window.createImageBitmap){
    try { return createImageBitmap(file, { imageOrientation:"from-image" }).catch(function(){ return loadImg(file); }); }
    catch(e){ return loadImg(file); }
  }
  return loadImg(file);
}
function loadImg(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), im = new Image();
    im.onload = function(){ URL.revokeObjectURL(url); res(im); };
    im.onerror = function(){ URL.revokeObjectURL(url); rej(new Error("imagem")); };
    im.src = url;
  });
}
function toBlob(src, maxDim, quality){
  var w = src.width, h = src.height, k = Math.min(1, maxDim/Math.max(w,h));
  var c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w*k)); c.height = Math.max(1, Math.round(h*k));
  var g2 = c.getContext("2d");
  g2.fillStyle = "#ffffff"; g2.fillRect(0,0,c.width,c.height);
  g2.drawImage(src, 0, 0, c.width, c.height);
  return new Promise(function(res){
    if(c.toBlob) c.toBlob(function(b){ res(b); }, "image/jpeg", quality);
    else res(dataURLtoBlob(c.toDataURL("image/jpeg", quality)));
  });
}
function dataURLtoBlob(d){
  var parts = d.split(","), bin = atob(parts[1]), arr = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type:"image/jpeg" });
}
function prepPhoto(file){
  return loadBitmap(file).then(function(src){
    return Promise.all([ toBlob(src, 1800, 0.84), toBlob(src, 320, 0.76) ]).then(function(r){
      if(src.close) src.close();
      return { full:r[0], thumb:r[1] };
    });
  });
}
/* sobe a foto e a miniatura, deixa as duas públicas e devolve os ids */
function subirFoto(p){
  var base = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  return criarArquivo(p.full, "image/jpeg", base + ".jpg")
    .then(function(id){ return tornarPublico(id); })
    .then(function(fileId){
      return criarArquivo(p.thumb, "image/jpeg", base + "-m.jpg")
        .then(function(id2){ return tornarPublico(id2); })
        .then(function(thumbId){ return { id:uid(), fileId:fileId, thumbId:thumbId }; });
    });
}
function subirFotos(lista, aoAndar){
  var out = [], chain = Promise.resolve();
  lista.forEach(function(p, i){
    chain = chain.then(function(){
      if(aoAndar) aoAndar(i+1, lista.length);
      return subirFoto(p).then(function(r){ out.push(r); });
    });
  });
  return chain.then(function(){ return out; });
}

/* se o login expirou (1 hora), renova e tenta de novo, uma vez */
function comLogin(acao){
  return acao().catch(function(err){
    if(err && (err.status === 401 || err.status === 403)){
      return renovar().then(acao);
    }
    throw err;
  });
}
function falhou(err, msgFn){

    msgFn("Seu acesso expirou. Clique no bonequinho lá em cima e entre de novo.");
    podeGravar = false; token = null; applyAuth();

  }
}

      return passo.then(function(fotos){
        msg("guardando…");
        return mudarIndex(function(ix){
          if(escolha.novo && !ix.folders.some(function(f){ return f.id === escolha.novo.id; })) ix.folders.push(escolha.novo);
          var antigo = null;
          for(var i=0;i<ix.entries.length;i++) if(ix.entries[i].id === dados.id){ antigo = ix.entries[i]; break; }

          }
        });
      });

      if(escolha.novo) openFolders[escolha.novo.id] = true;
      selected = dados.id;
      formCtx = { existing:null, draft:null, photos:[] };
      closeSheet();
      renderList(); renderMap();
    }).catch(function(err){
      btn.disabled = false; btn.textContent = existing ? "Guardar" : "Guardar o lugar";
      falhou(err, msg);
    });
  };
}

/* ===================== gravação de trajeto ===================== */
var rec = null, recTimer = 0, wakeLock = null, watchId = 0, recLine = null;
function recNote(s){ $("recnote").textContent = s || ""; }

$("addroute").onclick = function(){
  if(rec) return;
  if(!navigator.geolocation){
    alertSheet("GPS indisponível", "Este navegador não oferece localização. Abra o site pelo celular, em HTTPS.");
    return;
  }
  if(!window.isSecureContext){
    alertSheet("Precisa de HTTPS", "O navegador só libera o GPS em páginas servidas por HTTPS. Abra o site pelo endereço https://, não pelo arquivo salvo no computador.");
    return;
  }
  startRec();
};
function startRec(){
  rec = { points:[], startedAt:Date.now(), pausedMs:0, pausedAt:0, distanceKm:0, paused:false };
  $("rec").hidden = false;
  $("rec").classList.remove("paused");
  $("rec-pause").textContent = "Pausar";
  $("recwho").textContent = "Gravando o trajeto";
  recNote("Procurando sinal de GPS…");
  recLine = L.polyline([], { color: accentColor(), weight:4, opacity:.95, dashArray:"1 6", lineCap:"round" }).addTo(map);
  if(window.innerWidth < 900) $("side").classList.add("collapsed");
  watchId = navigator.geolocation.watchPosition(onFix, onFixError, { enableHighAccuracy:true, maximumAge:2000, timeout:20000 });
  recTimer = setInterval(tickRec, 1000);
  requestWake();
}
function requestWake(){
  if(!navigator.wakeLock) return;
  navigator.wakeLock.request("screen").then(function(w){ wakeLock = w; }).catch(function(){});
}
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible" && rec && !rec.paused && !wakeLock) requestWake();
});
function onFix(pos){
  if(!rec || rec.paused) return;
  var c = pos.coords;
  if(c.accuracy && c.accuracy > 60){ recNote("Sinal fraco (±" + Math.round(c.accuracy) + " m). Aguardando melhorar."); return; }
  var last = rec.points[rec.points.length-1];
  if(last){
    var d = haversine(last[0], last[1], c.latitude, c.longitude);
    if(d < 0.004) return;
    if(d > 2 && (pos.timestamp - last[2]) < 20000) return;
    rec.distanceKm += d;
  }
  rec.points.push([Number(c.latitude.toFixed(6)), Number(c.longitude.toFixed(6)), pos.timestamp]);
  recLine.addLatLng([c.latitude, c.longitude]);
  if(rec.points.length === 1 || rec.points.length % 12 === 0) map.panTo([c.latitude, c.longitude], { animate:true });
  recNote(rec.points.length + " pontos · precisão ±" + Math.round(c.accuracy||0) + " m");
  salvarRascunho();
}
function onFixError(err){
  if(!rec) return;
  recNote(err && err.code === 1
    ? "Permissão de localização negada. Libere o GPS para este site nas configurações do navegador."
    : "Sem sinal de GPS no momento. Continuo tentando.");
}
function elapsed(){
  if(!rec) return 0;
  var now = rec.paused ? rec.pausedAt : Date.now();
  return now - rec.startedAt - rec.pausedMs;
}
function tickRec(){
  if(!rec) return;
  var ms = elapsed();
  $("rec-time").textContent = fmtDur(ms);
  $("rec-km").textContent = num(rec.distanceKm, 2);
  var h = ms/3600000;
  $("rec-spd").textContent = h > 0.002 ? num(rec.distanceKm/h, 1) : "0,0";
}
function salvarRascunho(){
  if(!rec) return;
  try { localStorage.setItem("lb-rascunho", JSON.stringify({ points:rec.points, startedAt:rec.startedAt, distanceKm:rec.distanceKm })); } catch(e){}
}
function limparRascunho(){ try { localStorage.removeItem("lb-rascunho"); } catch(e){} }

$("rec-pause").onclick = function(){
  if(!rec) return;
  if(rec.paused){
    rec.pausedMs += Date.now() - rec.pausedAt;
    rec.paused = false; rec.pausedAt = 0;
    $("rec").classList.remove("paused");
    $("rec-pause").textContent = "Pausar";
    $("recwho").textContent = "Gravando o trajeto";
    watchId = navigator.geolocation.watchPosition(onFix, onFixError, { enableHighAccuracy:true, maximumAge:2000, timeout:20000 });
    requestWake();
  } else {
    rec.paused = true; rec.pausedAt = Date.now();
    $("rec").classList.add("paused");
    $("rec-pause").textContent = "Continuar";
    $("recwho").textContent = "Trajeto pausado";
    if(watchId) navigator.geolocation.clearWatch(watchId);
    if(wakeLock){ try { wakeLock.release(); } catch(e){} wakeLock = null; }
  }
};
$("rec-drop").onclick = function(){
  var b = $("rec-drop");
  if(b.getAttribute("data-armed") !== "1"){
    b.setAttribute("data-armed","1"); b.textContent = "Descartar mesmo?";
    setTimeout(function(){ if(b.isConnected){ b.setAttribute("data-armed",""); b.textContent = "Descartar"; } }, 4000);
    return;
  }
  endRecording(); limparRascunho();
  b.setAttribute("data-armed",""); b.textContent = "Descartar";
};
$("rec-stop").onclick = function(){
  if(!rec) return;
  if(rec.points.length < 2){
    recNote("O trajeto ainda não tem pontos suficientes para ser guardado.");
    return;
  }
  var done = {
    points: rec.points.slice(), startedAt: rec.startedAt, endedAt: Date.now(),
    durationMs: elapsed(), distanceKm: rec.distanceKm
  };
  endRecording();
  openRouteForm(done);
};
function endRecording(){
  if(watchId){ navigator.geolocation.clearWatch(watchId); watchId = 0; }
  if(recTimer){ clearInterval(recTimer); recTimer = 0; }
  if(wakeLock){ try { wakeLock.release(); } catch(e){} wakeLock = null; }
  if(recLine){ map.removeLayer(recLine); recLine = null; }
  rec = null;
  $("rec").hidden = true;
  recNote("");
}

  var body =

    '</div>' +
    '<div class="row"><div><label class="lb" for="f-title">Como vocês vão chamar esse caminho?</label>' +
      '<input class="in" id="f-title" type="text" maxlength="90" placeholder="Volta no parque, ida pra praia…"></div></div>' +
    '<div class="row"><div><label class="lb" for="f-date">Data</label>' +
      '<input class="in" id="f-date" type="date" value="'+todayISO(new Date(done.startedAt))+'"></div>' +
      '<div><label class="lb" for="f-folder">Faz parte de qual acontecimento</label>'+folderSelectHTML("inbox")+'</div></div>' +
    '<div class="row"><div><label class="lb" for="f-note">Como foi o caminho</label>' +
      '<textarea class="in" id="f-note" maxlength="2000" placeholder="O que vocês viram, conversaram, comeram"></textarea></div></div>' +
    '<div class="row"><div><label class="lb">Fotos do caminho</label>' +
      '<div class="drop" id="f-drop">Escolher as fotos</div>' +
      '<input type="file" id="f-file" accept="image/*" multiple hidden>' +
      '<div class="thumbs" id="f-thumbs" style="margin-top:10px"></div></div></div>' +
    '<div class="msg" id="f-msg" hidden></div>';
  var actions = '<button class="btn ghost" type="button" id="f-cancel">Descartar</button><span class="spacer"></span>' +
    '<button class="btn primary" type="button" id="f-save">Guardar o trajeto</button>';

  sheet("Trajeto gravado", body, actions);
  wireFolderSelect();
  $("f-title").focus();

  function msg(s){ var m = $("f-msg"); if(!m) return; m.textContent = s||""; m.hidden = !s; }
  function thumbs(){
    var box = $("f-thumbs"); if(!box) return;
    box.innerHTML = pending.map(function(p,i){
      if(!p.url) p.url = URL.createObjectURL(p.thumb);
      return '<div class="t"><img src="'+p.url+'" alt=""><button type="button" data-i="'+i+'" aria-label="Remover foto">' +
        '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>';
    }).join("");
    Array.prototype.forEach.call(box.querySelectorAll("button"), function(b){
      b.onclick = function(){ pending.splice(Number(b.getAttribute("data-i")),1); thumbs(); };
    });
  }
  var fileEl = $("f-file");
  $("f-drop").onclick = function(){ fileEl.click(); };
  fileEl.onchange = function(){
    var list = Array.prototype.slice.call(fileEl.files||[]); fileEl.value = "";
    if(!list.length) return;
    msg("preparando as fotos…");
    var chain = Promise.resolve();
    list.slice(0,30).forEach(function(f){
      chain = chain.then(function(){ return prepPhoto(f).then(function(r){ pending.push(r); thumbs(); }).catch(function(){}); });
    });
    chain.then(function(){ msg(""); });
  };
  $("f-cancel").onclick = function(){
    var b = $("f-cancel");
    if(b.getAttribute("data-armed") !== "1"){
      b.setAttribute("data-armed","1"); b.textContent = "Descartar mesmo?";
      setTimeout(function(){ if(b.isConnected){ b.setAttribute("data-armed",""); b.textContent = "Descartar"; } }, 4000);
      return;
    }
    limparRascunho(); closeSheet();
  };
  $("f-save").onclick = function(){
    var btn = $("f-save"); btn.disabled = true; btn.textContent = "Guardando…";
    var escolha = escolhaDePasta();
    var dados = {
      id: uid(), type:"route",
      title: $("f-title").value.trim() || "Trajeto sem nome",
      date: $("f-date").value || todayISO(new Date(done.startedAt)),
      note: $("f-note").value.trim(),
      folderId: escolha.id === "inbox" ? null : escolha.id,
      points: done.points, startedAt: done.startedAt, endedAt: done.endedAt,
      durationMs: done.durationMs, distanceKm: done.distanceKm,
      createdAt: Date.now()
    };
    comLogin(function(){
      var passo = Promise.resolve([]);
      if(pending.length){
        msg("enviando as fotos…");
        passo = subirFotos(pending, function(i,n){ msg("enviando foto " + i + " de " + n + "…"); });
      }
      return passo.then(function(fotos){
        dados.photos = fotos;
        msg("guardando…");
        return mudarIndex(function(ix){
          if(escolha.novo && !ix.folders.some(function(f){ return f.id === escolha.novo.id; })) ix.folders.push(escolha.novo);
          ix.entries.push(dados);
        });
      });
    }).then(function(){
      if(escolha.novo) openFolders[escolha.novo.id] = true;
      selected = dados.id;
      limparRascunho();
      closeSheet();
      renderList(); renderMap();
    }).catch(function(err){
      btn.disabled = false; btn.textContent = "Guardar o trajeto";
      falhou(err, msg);
    });
  };
}

/* ===================== detalhe ===================== */
function openDetail(id){
  var en = entryById(id); if(!en) return;
  var f = folderOf(en.folderId) || folderOf("inbox");
  var editavel = podeGravar;
  var facts = "";
  if(en.type === "route"){
    var avg = en.durationMs > 0 ? en.distanceKm/(en.durationMs/3600000) : 0;
    facts = '<div class="facts">' +
      '<div class="fact"><b>'+num(en.distanceKm,2)+'</b><span>km percorridos</span></div>' +
      '<div class="fact"><b>'+fmtDur(en.durationMs)+'</b><span>tempo</span></div>' +
      '<div class="fact"><b>'+num(avg,1)+'</b><span>km/h médio</span></div>' +
      '<div class="fact"><b>'+fmtClock(en.startedAt)+' – '+fmtClock(en.endedAt)+'</b><span>horário</span></div>' +
      '</div>';
  }
  var body = facts +
    '<div id="d-photos" class="thumbs"></div>' +
    '<div id="d-state" class="meta"></div>' +
    (en.note ? '<div class="note">'+esc(en.note)+'</div>' : '') +
    '<div class="meta"><span class="pill">' +
      (en.type==="route" ? (en.points?en.points.length:0)+" pontos de GPS" : (Number(en.lat)||0).toFixed(5)+", "+(Number(en.lng)||0).toFixed(5)) +
    '</span></div>' +
    (editavel ? '<input type="file" id="d-file" accept="image/*" multiple hidden>' : '') +
    '<div class="msg" id="d-msg" hidden></div>';
  var actions = editavel
    ? '<button class="btn" type="button" id="d-add">Adicionar fotos</button>' +
      '<button class="btn" type="button" id="d-edit">Editar</button><span class="spacer"></span>' +
      '<button class="btn danger" type="button" id="d-del">Apagar</button>'
    : '<span class="spacer"></span><button class="btn" type="button" id="d-ok">Fechar</button>';

  sheet(esc(en.title) + '<span class="sub">' + esc(fmtDate(en.date)) + ' · ' + esc(f ? f.name : "Momentos soltos") + '</span>', body, actions);
  var ok = $("d-ok"); if(ok) ok.onclick = closeSheet;

  function state(s){ var e = $("d-state"); if(!e) return; e.textContent = s||""; e.hidden = !s; }
  function dmsg(s){ var m = $("d-msg"); if(!m) return; m.textContent = s||""; m.hidden = !s; }
  function paint(){
    var box = $("d-photos"); if(!box) return;
    var atual = entryById(id) || en;
    var fotos = atual.photos || [];
    box.innerHTML = fotos.map(function(p,i){
      return '<div class="t"><img src="'+fotoURL(p.thumbId)+'" data-i="'+i+'" alt="">' +
        (editavel ? '<button type="button" data-del="'+i+'" aria-label="Remover foto"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>' : '') +
        '</div>';
    }).join("");
    state(fotos.length ? "" : "Sem fotos ainda — que tal a primeira?");
    Array.prototype.forEach.call(box.querySelectorAll("img"), function(im){
      im.onclick = function(){
        $("lbimg").src = fotoURL(fotos[Number(im.getAttribute("data-i"))].fileId);
        $("lightbox").hidden = false;
      };
    });
    Array.prototype.forEach.call(box.querySelectorAll("[data-del]"), function(b){
      b.onclick = function(){
        var p = fotos[Number(b.getAttribute("data-del"))];
        b.disabled = true;
        comLogin(function(){
          return mudarIndex(function(ix){
            ix.entries.forEach(function(e){
              if(e.id === id) e.photos = (e.photos||[]).filter(function(x){ return x.id !== p.id; });
            });
          }).then(function(){
            return apagarArquivo(p.fileId).then(function(){ return apagarArquivo(p.thumbId); });
          });
        }).then(function(){ paint(); })
          .catch(function(err){ b.disabled = false; falhou(err, dmsg); });
      };
    });
  }
  paint();

  if(editavel){
    $("d-add").onclick = function(){ $("d-file").click(); };
    $("d-file").onchange = function(){
      var list = Array.prototype.slice.call($("d-file").files||[]); $("d-file").value = "";
      if(!list.length) return;
      dmsg("preparando as fotos…");
      var prontas = [];
      var chain = Promise.resolve();
      list.slice(0,30).forEach(function(file){
        chain = chain.then(function(){ return prepPhoto(file).then(function(r){ prontas.push(r); }).catch(function(){}); });
      });
      chain.then(function(){
        if(!prontas.length){ dmsg("Nenhuma imagem pôde ser lida."); return null; }
        return comLogin(function(){
          return subirFotos(prontas, function(i,n){ dmsg("enviando foto " + i + " de " + n + "…"); })
            .then(function(fotos){
              dmsg("guardando…");
              return mudarIndex(function(ix){
                ix.entries.forEach(function(e){
                  if(e.id === id) e.photos = (e.photos||[]).concat(fotos);
                });
              });
            });
        });
      }).then(function(){ dmsg(""); paint(); })
        .catch(function(err){ falhou(err, dmsg); });
    };
    $("d-edit").onclick = function(){
      var cur = entryById(id);
      if(!cur) return;
      if(cur.type === "place"){ formCtx = { existing:cur, draft:null, photos:[] }; openPlaceForm(cur, null, null); }
      else openRouteEdit(cur);
    };
    $("d-del").onclick = function(){
      var b = $("d-del");
      if(b.getAttribute("data-armed") !== "1"){
        b.setAttribute("data-armed","1"); b.textContent = "Apagar mesmo?";
        setTimeout(function(){ if(b.isConnected){ b.setAttribute("data-armed",""); b.textContent = "Apagar"; } }, 4000);
        return;
      }
      b.disabled = true; b.textContent = "Apagando…";
      var fotos = ((entryById(id)||en).photos || []).slice();
      comLogin(function(){
        return mudarIndex(function(ix){
          ix.entries = ix.entries.filter(function(e){ return e.id !== id; });
        }).then(function(){
          var chain = Promise.resolve();
          fotos.forEach(function(p){
            chain = chain.then(function(){ return apagarArquivo(p.fileId); })
                         .then(function(){ return apagarArquivo(p.thumbId); });
          });
          return chain;
        });
      }).then(function(){ selected = null; closeSheet(); renderList(); renderMap(); })
        .catch(function(err){ b.disabled = false; b.textContent = "Apagar"; falhou(err, dmsg); });
    };
  }
}

function openRouteEdit(en){
  var body =
    '<div class="row"><div><label class="lb" for="f-title">Nome do trajeto</label>' +
      '<input class="in" id="f-title" type="text" maxlength="90" value="'+esc(en.title)+'"></div></div>' +
    '<div class="row"><div><label class="lb" for="f-date">Data</label>' +
      '<input class="in" id="f-date" type="date" value="'+esc(en.date)+'"></div>' +
      '<div><label class="lb" for="f-folder">Faz parte de qual acontecimento</label>'+folderSelectHTML(en.folderId||"inbox")+'</div></div>' +
    '<div class="row"><div><label class="lb" for="f-note">Como foi o caminho</label>' +
      '<textarea class="in" id="f-note" maxlength="2000">'+esc(en.note||"")+'</textarea></div></div>' +
    '<div class="meta">O traçado, o tempo e a distância vêm do GPS e não mudam.</div>' +
    '<div class="msg" id="f-msg" hidden></div>';
  sheet("Editar o trajeto", body,
    '<button class="btn ghost" type="button" id="f-cancel">Cancelar</button><span class="spacer"></span>' +
    '<button class="btn primary" type="button" id="f-save">Guardar</button>');
  wireFolderSelect();
  $("f-cancel").onclick = closeSheet;
  function msg(s){ var m = $("f-msg"); if(!m) return; m.textContent = s||""; m.hidden = !s; }
  $("f-save").onclick = function(){
    var btn = $("f-save"); btn.disabled = true; btn.textContent = "Guardando…";
    var escolha = escolhaDePasta();
    var novo = {
      title: $("f-title").value.trim() || "Trajeto sem nome",
      date: $("f-date").value || en.date,
      note: $("f-note").value.trim(),
      folderId: escolha.id === "inbox" ? null : escolha.id
    };
    comLogin(function(){
      return mudarIndex(function(ix){
        if(escolha.novo && !ix.folders.some(function(f){ return f.id === escolha.novo.id; })) ix.folders.push(escolha.novo);
        ix.entries.forEach(function(e){
          if(e.id === en.id){ e.title = novo.title; e.date = novo.date; e.note = novo.note; e.folderId = novo.folderId; }
        });
      });
    }).then(function(){ closeSheet(); renderList(); renderMap(); })
      .catch(function(err){ btn.disabled = false; btn.textContent = "Guardar"; falhou(err, msg); });
  };
}

/* ===================== conta e acontecimentos ===================== */
$("menubtn").onclick = function(){ openMenu(); };
$("authbtn").onclick = function(){ openConta(); };

function openConta(){
  var corpo;
  if(!CONFIG.CLIENT_ID){
    corpo = '<div class="note" style="margin-top:0">O login ainda não foi configurado. Falta o CLIENT_ID no começo deste arquivo.</div>';
  } else if(podeGravar && !CONFIG.FOLDER_ID){
    corpo = '<div class="note" style="margin-top:0">Você entrou. Falta criar a pasta onde as memórias vão morar — é uma vez só.</div>' +
      '<div class="row" style="margin-top:16px"><div style="flex:0 0 auto">' +
      '<button class="btn primary" type="button" id="c-pasta">Criar a pasta do site</button></div></div>' +
      '<div class="msg" id="c-msg" hidden></div>';
  } else if(podeGravar){
    corpo = '<div class="note" style="margin-top:0">Você entrou na conta do site e pode adicionar, editar e apagar. ' +
      'Quem só abrir o endereço continua vendo tudo, sem precisar entrar.</div>' +
      '<div class="row" style="margin-top:16px"><div style="flex:0 0 auto">' +
      '<button class="btn" type="button" id="c-sair">Sair</button></div></div>';
  } else {
    corpo = '<div class="note" style="margin-top:0">Qualquer pessoa abre este site e vê tudo. Para adicionar ou apagar, ' +
      'entre com a conta do site — aquela que vocês dois usam.</div>' +
      '<div class="row" style="margin-top:16px"><div style="flex:0 0 auto">' +
      '<button class="btn primary" type="button" id="c-entrar">Entrar com o Google</button></div></div>';
  }
  sheet("Nossa conta", '<div id="conta-area">'+corpo+'</div>',
    '<span class="spacer"></span><button class="btn primary" type="button" id="c-ok">Fechar</button>');
  $("c-ok").onclick = closeSheet;
  var e1 = $("c-entrar"); if(e1) e1.onclick = entrar;
  var e2 = $("c-sair");   if(e2) e2.onclick = sair;
  var e3 = $("c-pasta");  if(e3) e3.onclick = criarPastaDoSite;
}

function criarPastaDoSite(){
  var m = $("c-msg");
  function msg(s){ if(m){ m.textContent = s||""; m.hidden = !s; } }
  msg("criando…");
  comLogin(function(){
    return gJSON(DRIVE + "/files?fields=id", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ name:"Le&Beni — memórias", mimeType:"application/vnd.google-apps.folder" })
    });
  }).then(function(j){
    return tornarPublico(j.id).then(function(){ return j.id; });
  }).then(function(id){
    sheet("Pasta criada",
      '<div class="note" style="margin-top:0">Pronto. Agora copie o código abaixo e cole no arquivo do site, ' +
      'na linha <strong>FOLDER_ID</strong>, lá no começo. É a última coisa que você preenche à mão.</div>' +
      '<div class="in" style="margin-top:14px;font-family:var(--mono);word-break:break-all;user-select:all">'+esc(id)+'</div>' +
      '<div class="meta">Depois de colar, salve o arquivo, suba de novo pra hospedagem e recarregue o site.</div>',
      '<span class="spacer"></span><button class="btn primary" type="button" id="p-copiar">Copiar o código</button>');
    $("p-copiar").onclick = function(){
      var btn = $("p-copiar");
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(id).then(function(){ btn.textContent = "Copiado"; })
          .catch(function(){ btn.textContent = "Selecione e copie à mão"; });
      } else btn.textContent = "Selecione e copie à mão";
    };
  }).catch(function(err){ falhou(err, msg); });
}

function openMenu(){
  var rows = folders.slice().sort(function(a,b){
    if(a.id==="inbox") return 1; if(b.id==="inbox") return -1;
    return (b.createdAt||0)-(a.createdAt||0);
  }).map(function(f){
    var n = entries.filter(function(e){ return e.folderId === f.id; }).length;
    var bloqueado = (f.id === "inbox") || !podeGravar;
    return '<div class="folderrow">' +
      '<input class="in" data-fid="'+esc(f.id)+'" value="'+esc(f.name)+'"'+(bloqueado?" disabled":"")+'>' +
      '<span class="pill">'+n+'</span>' +
      (bloqueado ? '' : '<button class="icon" type="button" data-fdel="'+esc(f.id)+'" aria-label="Apagar acontecimento">' +
        '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>') +
      '</div>';
  }).join("");

  var body = '<label class="lb">Nossos acontecimentos</label><div id="m-folders">'+rows+'</div>' +
    (podeGravar
      ? '<div class="row" style="margin-top:12px"><div>' +
        '<input class="in" id="m-new" type="text" placeholder="Um novo acontecimento"></div>' +
        '<div style="flex:0 0 auto"><button class="btn" type="button" id="m-add">Criar</button></div></div>'
      : '<div class="meta">Entre na conta do site para criar ou renomear acontecimentos.</div>') +
    '<div class="meta" style="margin-top:18px"><b>Onde isso tudo fica</b><br>' +
      'No Google Drive da conta do site. Quem abrir este endereço vê tudo, de qualquer aparelho, sem precisar de nada.</div>' +
    '<div class="msg" id="m-msg" hidden></div>';

  sheet("Acontecimentos", body, '<span class="spacer"></span><button class="btn primary" type="button" id="m-ok">Fechar</button>');
  $("m-ok").onclick = closeSheet;
  function mmsg(s){ var m = $("m-msg"); if(!m) return; m.textContent = s||""; m.hidden = !s; }

  Array.prototype.forEach.call(scrim.querySelectorAll("[data-fid]"), function(inp){
    inp.onchange = function(){
      var fid = inp.getAttribute("data-fid");
      var novo = inp.value.trim();
      if(!novo) return;
      comLogin(function(){
        return mudarIndex(function(ix){
          ix.folders.forEach(function(f){ if(f.id === fid) f.name = novo; });
        });
      }).then(function(){ renderList(); }).catch(function(err){ falhou(err, mmsg); });
    };
  });
  Array.prototype.forEach.call(scrim.querySelectorAll("[data-fdel]"), function(b){
    b.onclick = function(){
      var fid = b.getAttribute("data-fdel");
      if(b.getAttribute("data-armed") !== "1"){
        b.setAttribute("data-armed","1"); b.style.width = "auto"; b.textContent = "apagar?";
        setTimeout(function(){ if(b.isConnected) openMenu(); }, 4000);
        return;
      }
      comLogin(function(){
        return mudarIndex(function(ix){
          ix.folders = ix.folders.filter(function(f){ return f.id !== fid; });
          ix.entries.forEach(function(e){ if(e.folderId === fid) e.folderId = null; });
        });
      }).then(function(){ openMenu(); }).catch(function(err){ falhou(err, mmsg); });
    };
  });
  var add = $("m-add");
  if(add) add.onclick = function(){
    var name = $("m-new").value.trim();
    if(!name){ mmsg("Dá um nome a esse acontecimento."); return; }
    comLogin(function(){
      return mudarIndex(function(ix){
        ix.folders.push({ id: uid(), name: name, createdAt: Date.now() });
      });
    }).then(function(){ openMenu(); }).catch(function(err){ falhou(err, mmsg); });
  };
}

/* ===================== tema ===================== */
function applyTheme(t){
  if(t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
  try { localStorage.setItem("lb-tema", t || "auto"); } catch(e){}
  renderMap();
}
(function(){
  var t = "auto";
  try { t = localStorage.getItem("lb-tema") || "auto"; } catch(e){}
  if(t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
})();
$("themebtn").onclick = function(){
  var cur = document.documentElement.getAttribute("data-theme");
  applyTheme(cur === "dark" ? "light" : (cur === "light" ? "auto" : "dark"));
};
if(window.matchMedia){
  var mqd = window.matchMedia("(prefers-color-scheme: dark)");
  if(mqd.addEventListener) mqd.addEventListener("change", function(){
    if(!document.documentElement.getAttribute("data-theme")) renderMap();
  });
}

/* ===================== diversos ===================== */
$("lbclose").onclick = function(){ $("lightbox").hidden = true; };
$("lightbox").addEventListener("pointerdown", function(e){ if(e.target.id === "lightbox") $("lightbox").hidden = true; });
$("sidetoggle").onclick = function(){ $("side").classList.toggle("collapsed"); };
if(window.innerWidth < 900) $("side").classList.add("collapsed");
window.addEventListener("beforeunload", function(e){
  if(rec){ e.preventDefault(); e.returnValue = ""; }
});

/* ===================== início ===================== */
(function espera(n){
  if(window.google && google.accounts && google.accounts.oauth2){ initAuth(); return; }
  if(n > 0) setTimeout(function(){ espera(n-1); }, 300);
})(25);

initMap();
applyAuth();
reload().then(function(){
  if(entries.length){
    var pts = [];
    entries.forEach(function(en){
      if(en.type === "place") pts.push([en.lat, en.lng]);
      else if(en.points && en.points.length) pts.push([en.points[0][0], en.points[0][1]]);
    });
    if(pts.length === 1) map.setView(pts[0], 14);
    else if(pts.length > 1) map.fitBounds(L.latLngBounds(pts).pad(0.2));
  }
  var r = null;
  try { r = JSON.parse(localStorage.getItem("lb-rascunho") || "null"); } catch(e){}
  if(r && r.points && r.points.length > 1 && podeGravar){
    var fim = r.points[r.points.length-1][2] || Date.now();
    openRouteForm({ points:r.points, startedAt:r.startedAt, endedAt:fim,
                    durationMs: fim - r.startedAt, distanceKm: r.distanceKm||0 });
  }
});
})();
