name = "le-beni"
main = "worker.js"
compatibility_date = "2026-05-01"

# Depois de criar o banco com
#   npx wrangler d1 create le-beni
# o terminal mostra um database_id. Cole ele aqui no lugar do COLE-AQUI.

[[d1_databases]]
binding = "DB"
database_name = "le-beni"
database_id = "COLE-AQUI"

# Quem pode gravar. Troque pelos e-mails de vocês dois, separados por vírgula,
# sem espaço. Este valor não é segredo — ele só diz quais contas valem.
[vars]
ALLOWED_EMAILS = "leticiadearaujofernandes@gmail.com,sauriandrawn@gmail.com"

# Os quatro segredos NÃO entram neste arquivo. Rode, um por vez:
#   npx wrangler secret put GOOGLE_CLIENT_ID
#   npx wrangler secret put DRIVE_CLIENT_ID
#   npx wrangler secret put DRIVE_CLIENT_SECRET
#   npx wrangler secret put DRIVE_REFRESH_TOKEN
